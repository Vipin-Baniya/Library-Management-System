<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${member.name + ' - Library Management System'}">Member Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-book-fill me-2"></i>LibraryMS</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/books}">Books</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/members}">Members</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/borrows}">Borrows</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/members}">Members</a></li>
            <li class="breadcrumb-item active" th:text="${member.name}"></li>
        </ol>
    </nav>

    <div class="row g-4">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 fw-bold"><i class="bi bi-person-circle me-2"></i>Member Details</h5>
                    <div>
                        <a th:href="@{/members/{id}/edit(id=${member.id})}" class="btn btn-sm btn-warning me-1">
                            <i class="bi bi-pencil"></i> Edit
                        </a>
                        <form th:action="@{/members/{id}/delete(id=${member.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Remove this member?')">
                            <button type="submit" class="btn btn-sm btn-danger">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </div>
                </div>
                <div class="card-body">
                    <dl class="row">
                        <dt class="col-sm-4">Name</dt>
                        <dd class="col-sm-8 fw-semibold" th:text="${member.name}"></dd>

                        <dt class="col-sm-4">Email</dt>
                        <dd class="col-sm-8" th:text="${member.email}"></dd>

                        <dt class="col-sm-4">Phone</dt>
                        <dd class="col-sm-8" th:text="${member.phone ?: 'N/A'}"></dd>

                        <dt class="col-sm-4">Address</dt>
                        <dd class="col-sm-8" th:text="${member.address ?: 'N/A'}"></dd>

                        <dt class="col-sm-4">Joined</dt>
                        <dd class="col-sm-8" th:text="${member.membershipDate}"></dd>

                        <dt class="col-sm-4">Status</dt>
                        <dd class="col-sm-8">
                            <span th:class="${'badge bg-' + (member.status.name() == 'ACTIVE' ? 'success' : member.status.name() == 'SUSPENDED' ? 'danger' : 'secondary')}"
                                  th:text="${member.status}"></span>
                        </dd>
                    </dl>
                </div>
            </div>
        </div>

        <div class="col-md-7">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h6 class="mb-0 fw-bold"><i class="bi bi-clock-history me-2"></i>Borrow History</h6>
                </div>
                <div class="card-body p-0">
                    <div th:if="${#lists.isEmpty(borrowHistory)}" class="text-center text-muted py-4">
                        <i class="bi bi-inbox fs-3 d-block mb-2"></i>No borrow history yet.
                    </div>
                    <table th:unless="${#lists.isEmpty(borrowHistory)}" class="table table-sm table-hover mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>Book</th>
                            <th>Borrowed</th>
                            <th>Due</th>
                            <th>Returned</th>
                            <th>Status</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="record : ${borrowHistory}">
                            <td>
                                <a th:href="@{/books/{id}(id=${record.book.id})}"
                                   th:text="${record.book.title}" class="text-decoration-none"></a>
                            </td>
                            <td th:text="${record.borrowDate}"></td>
                            <td th:text="${record.dueDate}"></td>
                            <td th:text="${record.returnDate ?: '—'}"></td>
                            <td>
                                <span th:class="${'badge bg-' + (record.status.name() == 'RETURNED' ? 'success' : record.status.name() == 'OVERDUE' ? 'danger' : 'primary')}"
                                      th:text="${record.status}"></span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="text-center text-muted py-3 mt-4 border-top small">
    &copy; 2024 Library Management System
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
