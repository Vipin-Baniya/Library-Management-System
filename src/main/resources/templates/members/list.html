<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Members - Library Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-book-fill me-2"></i>LibraryMS</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/books}">Books</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/members}">Members</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/borrows}">Borrows</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0"><i class="bi bi-people me-2"></i>Members</h4>
        <a th:href="@{/members/new}" class="btn btn-info text-white btn-sm">
            <i class="bi bi-person-plus me-1"></i>Register Member
        </a>
    </div>

    <!-- Search -->
    <form th:action="@{/members}" method="get" class="mb-3">
        <div class="input-group">
            <input type="text" name="query" class="form-control"
                   placeholder="Search by name or email..."
                   th:value="${query}"/>
            <button class="btn btn-outline-primary" type="submit">
                <i class="bi bi-search"></i> Search
            </button>
            <a th:if="${query}" th:href="@{/members}" class="btn btn-outline-secondary">
                <i class="bi bi-x"></i> Clear
            </a>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(members)}" class="text-center text-muted py-5">
                <i class="bi bi-people fs-1 d-block mb-2"></i>
                <span th:if="${query}">No members found for "<strong th:text="${query}"></strong>".</span>
                <span th:unless="${query}">No members registered yet.</span>
            </div>
            <table th:unless="${#lists.isEmpty(members)}" class="table table-hover table-striped mb-0">
                <thead class="table-info">
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Membership Date</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="member, iterStat : ${members}">
                    <td th:text="${iterStat.count}"></td>
                    <td>
                        <a th:href="@{/members/{id}(id=${member.id})}" th:text="${member.name}"
                           class="text-decoration-none fw-semibold"></a>
                    </td>
                    <td th:text="${member.email}"></td>
                    <td th:text="${member.phone ?: 'N/A'}"></td>
                    <td th:text="${member.membershipDate}"></td>
                    <td>
                        <span th:class="${'badge bg-' + (member.status.name() == 'ACTIVE' ? 'success' : member.status.name() == 'SUSPENDED' ? 'danger' : 'secondary')}"
                              th:text="${member.status}"></span>
                    </td>
                    <td>
                        <a th:href="@{/members/{id}/edit(id=${member.id})}" class="btn btn-sm btn-outline-warning me-1">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:action="@{/members/{id}/delete(id=${member.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Remove this member?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="text-muted small mt-2" th:unless="${#lists.isEmpty(members)}">
        Showing <span th:text="${members.size()}"></span> member(s).
    </div>
</main>

<footer class="text-center text-muted py-3 mt-4 border-top small">
    &copy; 2024 Library Management System
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
