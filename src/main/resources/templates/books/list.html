<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Books - Library Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-book-fill me-2"></i>LibraryMS</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}"><i class="bi bi-house-fill me-1"></i>Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/books}"><i class="bi bi-book me-1"></i>Books</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/members}"><i class="bi bi-people me-1"></i>Members</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/borrows}"><i class="bi bi-arrow-left-right me-1"></i>Borrows</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0"><i class="bi bi-book me-2"></i>Books</h4>
        <a th:href="@{/books/new}" class="btn btn-primary btn-sm">
            <i class="bi bi-plus-circle me-1"></i>Add Book
        </a>
    </div>

    <!-- Search -->
    <form th:action="@{/books}" method="get" class="mb-3">
        <div class="input-group">
            <input type="text" name="query" class="form-control"
                   placeholder="Search by title, author, or ISBN..."
                   th:value="${query}"/>
            <button class="btn btn-outline-primary" type="submit">
                <i class="bi bi-search"></i> Search
            </button>
            <a th:if="${query}" th:href="@{/books}" class="btn btn-outline-secondary">
                <i class="bi bi-x"></i> Clear
            </a>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(books)}" class="text-center text-muted py-5">
                <i class="bi bi-book fs-1 d-block mb-2"></i>
                <span th:if="${query}">No books found for "<strong th:text="${query}"></strong>".</span>
                <span th:unless="${query}">No books in the library yet.</span>
            </div>
            <table th:unless="${#lists.isEmpty(books)}" class="table table-hover table-striped mb-0">
                <thead class="table-primary">
                <tr>
                    <th>#</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>ISBN</th>
                    <th>Genre</th>
                    <th>Year</th>
                    <th>Available / Total</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="book, iterStat : ${books}">
                    <td th:text="${iterStat.count}"></td>
                    <td>
                        <a th:href="@{/books/{id}(id=${book.id})}" th:text="${book.title}" class="text-decoration-none fw-semibold"></a>
                    </td>
                    <td th:text="${book.author}"></td>
                    <td th:text="${book.isbn}"></td>
                    <td>
                        <span class="badge bg-secondary" th:text="${book.genre ?: 'N/A'}"></span>
                    </td>
                    <td th:text="${book.publicationYear}"></td>
                    <td>
                        <span th:class="${book.availableCopies > 0 ? 'text-success fw-bold' : 'text-danger fw-bold'}"
                              th:text="${book.availableCopies + ' / ' + book.totalCopies}"></span>
                    </td>
                    <td>
                        <a th:href="@{/books/{id}/edit(id=${book.id})}" class="btn btn-sm btn-outline-warning me-1">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:action="@{/books/{id}/delete(id=${book.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Delete this book?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="text-muted small mt-2" th:unless="${#lists.isEmpty(books)}">
        Showing <span th:text="${books.size()}"></span> book(s).
    </div>
</main>

<footer class="text-center text-muted py-3 mt-4 border-top small">
    &copy; 2024 Library Management System
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
