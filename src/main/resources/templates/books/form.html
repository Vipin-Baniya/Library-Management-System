<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle + ' - Library Management System'}">Book Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-book-fill me-2"></i>LibraryMS</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/books}">Books</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/members}">Members</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/borrows}">Borrows</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/books}">Books</a></li>
                    <li class="breadcrumb-item active" th:text="${pageTitle}"></li>
                </ol>
            </nav>
            <div class="card shadow-sm">
                <div class="card-header">
                    <h5 class="mb-0 fw-bold">
                        <i class="bi bi-book me-2"></i>
                        <span th:text="${pageTitle}"></span>
                    </h5>
                </div>
                <div class="card-body">
                    <form th:action="${book.id == null ? '/books/new' : '/books/' + book.id + '/edit'}"
                          th:object="${book}" method="post">

                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label fw-semibold">Title <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{title}" class="form-control"
                                       th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                                       placeholder="Enter book title"/>
                                <div class="invalid-feedback" th:errors="*{title}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Author <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{author}" class="form-control"
                                       th:classappend="${#fields.hasErrors('author')} ? 'is-invalid'"
                                       placeholder="Enter author name"/>
                                <div class="invalid-feedback" th:errors="*{author}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">ISBN <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{isbn}" class="form-control"
                                       th:classappend="${#fields.hasErrors('isbn')} ? 'is-invalid'"
                                       placeholder="e.g. 978-0-7432-7356-5"/>
                                <div class="invalid-feedback" th:errors="*{isbn}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Genre</label>
                                <input type="text" th:field="*{genre}" class="form-control"
                                       placeholder="e.g. Fiction, Technology"/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Publisher</label>
                                <input type="text" th:field="*{publisher}" class="form-control"
                                       placeholder="Publisher name"/>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Publication Year <span class="text-danger">*</span></label>
                                <input type="number" th:field="*{publicationYear}" class="form-control"
                                       th:classappend="${#fields.hasErrors('publicationYear')} ? 'is-invalid'"
                                       placeholder="e.g. 2023" min="1000" max="2099"/>
                                <div class="invalid-feedback" th:errors="*{publicationYear}"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Total Copies</label>
                                <input type="number" th:field="*{totalCopies}" class="form-control"
                                       th:classappend="${#fields.hasErrors('totalCopies')} ? 'is-invalid'"
                                       min="1"/>
                                <div class="invalid-feedback" th:errors="*{totalCopies}"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Available Copies</label>
                                <input type="number" th:field="*{availableCopies}" class="form-control"
                                       th:classappend="${#fields.hasErrors('availableCopies')} ? 'is-invalid'"
                                       min="0"/>
                                <div class="invalid-feedback" th:errors="*{availableCopies}"></div>
                            </div>
                        </div>

                        <div class="mt-4 d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-1"></i>Save Book
                            </button>
                            <a th:href="@{/books}" class="btn btn-secondary">
                                <i class="bi bi-x-circle me-1"></i>Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="text-center text-muted py-3 mt-4 border-top small">
    &copy; 2024 Library Management System
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
