<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${book.title + ' - Library Management System'}">Book Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-book-fill me-2"></i>LibraryMS</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/books}">Books</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/members}">Members</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/borrows}">Borrows</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/books}">Books</a></li>
            <li class="breadcrumb-item active" th:text="${book.title}"></li>
        </ol>
    </nav>

    <div class="row g-4">
        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 fw-bold"><i class="bi bi-book me-2"></i>Book Details</h5>
                    <div>
                        <a th:href="@{/books/{id}/edit(id=${book.id})}" class="btn btn-sm btn-warning me-1">
                            <i class="bi bi-pencil"></i> Edit
                        </a>
                        <form th:action="@{/books/{id}/delete(id=${book.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Delete this book?')">
                            <button type="submit" class="btn btn-sm btn-danger">
                                <i class="bi bi-trash"></i> Delete
                            </button>
                        </form>
                    </div>
                </div>
                <div class="card-body">
                    <dl class="row">
                        <dt class="col-sm-4">Title</dt>
                        <dd class="col-sm-8 fw-semibold" th:text="${book.title}"></dd>

                        <dt class="col-sm-4">Author</dt>
                        <dd class="col-sm-8" th:text="${book.author}"></dd>

                        <dt class="col-sm-4">ISBN</dt>
                        <dd class="col-sm-8"><code th:text="${book.isbn}"></code></dd>

                        <dt class="col-sm-4">Genre</dt>
                        <dd class="col-sm-8">
                            <span class="badge bg-secondary" th:text="${book.genre ?: 'N/A'}"></span>
                        </dd>

                        <dt class="col-sm-4">Publisher</dt>
                        <dd class="col-sm-8" th:text="${book.publisher ?: 'N/A'}"></dd>

                        <dt class="col-sm-4">Year</dt>
                        <dd class="col-sm-8" th:text="${book.publicationYear}"></dd>

                        <dt class="col-sm-4">Total Copies</dt>
                        <dd class="col-sm-8" th:text="${book.totalCopies}"></dd>

                        <dt class="col-sm-4">Available</dt>
                        <dd class="col-sm-8">
                            <span th:class="${book.availableCopies > 0 ? 'badge bg-success' : 'badge bg-danger'}"
                                  th:text="${book.availableCopies + ' copy(ies)'}"></span>
                        </dd>
                    </dl>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-header">
                    <h6 class="mb-0 fw-bold"><i class="bi bi-clock-history me-2"></i>Borrow History</h6>
                </div>
                <div class="card-body p-0">
                    <div th:if="${#lists.isEmpty(book.borrowRecords)}" class="text-center text-muted py-4">
                        <i class="bi bi-inbox fs-3 d-block mb-2"></i>No borrow history yet.
                    </div>
                    <ul class="list-group list-group-flush" th:unless="${#lists.isEmpty(book.borrowRecords)}">
                        <li class="list-group-item" th:each="record : ${book.borrowRecords}">
                            <div class="d-flex justify-content-between">
                                <span th:text="${record.member.name}" class="fw-semibold"></span>
                                <span th:class="${'badge bg-' + (record.status.name() == 'RETURNED' ? 'success' : record.status.name() == 'OVERDUE' ? 'danger' : 'primary')}"
                                      th:text="${record.status}"></span>
                            </div>
                            <small class="text-muted">
                                Borrowed: <span th:text="${record.borrowDate}"></span> &mdash;
                                Due: <span th:text="${record.dueDate}"></span>
                            </small>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="text-center text-muted py-3 mt-4 border-top small">
    &copy; 2024 Library Management System
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
